name: Build

on:
  push:
    branches: [main]
  pull_request:
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check that dist/ is up to date
        if: github.event_name != 'release'
        run: git diff --exit-code -- dist/ || (echo "Run 'npm run build' and commit dist/" && exit 1)
      - name: Attach the card to the release (used by HACS)
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ github.event.release.tag_name }}" dist/hacomfoairmqtt-card.js --clobber
